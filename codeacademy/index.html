:"HTML Grundlagen",lessons:[{id:"html-intro",title:"Einführung in HTML",content:`<h1>Was ist HTML?</h1>
<p>HTML steht für <strong>HyperText Markup Language</strong> und ist die Standardsprache zur Erstellung von Webseiten. HTML beschreibt die <em>Struktur</em> einer Webseite mithilfe von Elementen.</p>
<p>HTML-Elemente werden durch <strong>Tags</strong> dargestellt, die dem Browser mitteilen, wie der Inhalt dargestellt werden soll.</p>
<h2>Ein einfaches HTML-Dokument</h2>
<p>Jede HTML-Seite beginnt mit einer Grundstruktur, die dem Browser die notwendigen Informationen liefert:</p>
<ul>
  <li><code>&lt;!DOCTYPE html&gt;</code> – Deklariert den Dokumenttyp</li>
  <li><code>&lt;html&gt;</code> – Das Wurzelelement der Seite</li>
  <li><code>&lt;head&gt;</code> – Enthält Meta-Informationen</li>
  <li><code>&lt;body&gt;</code> – Enthält den sichtbaren Seiteninhalt</li>
</ul>`,codeExample:{language:"html",code:`<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Meine erste Webseite</title>
  </head>
  <body>
    <h1>Hallo, Welt!</h1>
    <p>Das ist meine erste Webseite.</p>
  </body>
</html>`},microExercise:{question:"Welches Tag wird für den sichtbaren Seiteninhalt verwendet?",codeTemplate:`<html>
  <head>...</head>
  <___>
    <h1>Inhalt hier</h1>
  </___>
</html>`,answer:"body",hint:"Es ist das Element, das alles enthält, was der Benutzer sieht."}},{id:"html-elements",title:"HTML Elemente",content:`<h1>HTML Elemente</h1>
<p>Ein HTML-Element besteht aus einem <strong>öffnenden Tag</strong>, dem <strong>Inhalt</strong> und einem <strong>schließenden Tag</strong>:</p>
<p>Die meisten HTML-Elemente haben sowohl ein öffnendes als auch ein schließendes Tag. Einige Elemente sind <em>selbstschließend</em>, wie <code>&lt;br&gt;</code> oder <code>&lt;img&gt;</code>.</p>
<h2>Häufig verwendete Elemente</h2>
<ul>
  <li><code>&lt;h1&gt;</code> bis <code>&lt;h6&gt;</code> – Überschriften</li>
  <li><code>&lt;p&gt;</code> – Absatz</li>
  <li><code>&lt;a&gt;</code> – Hyperlink</li>
  <li><code>&lt;img&gt;</code> – Bild</li>
  <li><code>&lt;div&gt;</code> – Container-Block</li>
  <li><code>&lt;span&gt;</code> – Inline-Container</li>
</ul>`,codeExample:{language:"html",code:`<h1>Hauptüberschrift</h1>
<h2>Unterüberschrift</h2>
<p>Ein normaler <strong>Absatz</strong> mit <em>formatiertem</em> Text.</p>
<a href="https://example.com">Ein Link</a>
<br>
<img src="bild.jpg" alt="Beschreibung">`},microExercise:{question:"Welches Tag erstellt einen Hyperlink?",codeTemplate:'<___ href="https://example.com">Klick mich!</___>;',answer:"a",hint:"Es steht für 'anchor' (Anker)."}},{id:"html-attributes",title:"HTML Attribute",content:`<h1>HTML Attribute</h1>
<p>Attribute liefern zusätzliche Informationen über HTML-Elemente. Sie werden immer im <strong>öffnenden Tag</strong> angegeben und bestehen aus einem <strong>Name-Wert-Paar</strong>:</p>
<p>Attribute haben die Form: <code>name="wert"</code></p>
<h2>Wichtige Attribute</h2>
<ul>
  <li><code>href</code> – URL für Links</li>
  <li><code>src</code> – Quelle für Bilder/Skripte</li>
  <li><code>alt</code> – Alternativtext für Bilder</li>
  <li><code>class</code> – CSS-Klasse</li>
  <li><code>id</code> – Eindeutiger Bezeichner</li>
  <li><code>style</code> – Inline-CSS</li>
</ul>`,codeExample:{language:"html",code:`\x3C!-- Link mit href-Attribut -->
<a href="https://example.com" target="_blank">
  Öffne in neuem Tab
</a>

\x3C!-- Bild mit src und alt -->
<img src="logo.png" alt="Firmenlogo" width="200">

\x3C!-- Element mit class und id -->
<div class="container" id="main-content">
  Inhalt hier
</div>`},microExercise:{question:"Welches Attribut gibt den Alternativtext für ein Bild an?",codeTemplate:'<img src="bild.jpg" ___="Beschreibung des Bildes">',answer:"alt",hint:"Es steht für 'alternative' und ist wichtig für Barrierefreiheit."}}],quiz:[{id:"q1",question:"Was steht die Abkürzung HTML für?",options:["HyperText Markup Language","High-Tech Modern Language","HyperTransfer Markup Language","Hyper Template Markup Language"],correctIndex:0,explanation:"HTML steht für HyperText Markup Language – die Standardsprache zur Erstellung von Webseiten."},{id:"q2",question:"Welches Element enthält den sichtbaren Inhalt einer Webseite?",options:["<head>","<html>","<body>","<main>"],correctIndex:2,explanation:"Das <body>-Element enthält alles, was im Browser sichtbar ist – Text, Bilder, Links usw."},{id:"q3",question:"Wie schreibt man korrekt einen selbstschließenden Tag?",options:["<br></br>","<br/>","<br>","Beide b und c sind korrekt"],correctIndex:3,explanation:"In HTML5 sind sowohl <br> als auch <br/> gültig. Selbstschließende Tags benötigen kein separates schließendes Tag."},{id:"q4",question:"Welches Attribut wird für Hyperlinks verwendet?",options:["src","link","href","url"],correctIndex:2,explanation:"Das href-Attribut (Hypertext Reference) gibt die URL an, auf die ein Link verweist."},{id:"q5",question:"Was ist die korrekte Reihenfolge der HTML-Grundstruktur?",options:["html → head → body → DOCTYPE","DOCTYPE → html → head → body","DOCTYPE → body → head → html","head → html → DOCTYPE → body"],correctIndex:1,explanation:"Die korrekte Reihenfolge ist: <!DOCTYPE html> → <html> → <head> → <body>"}]},{id:"html-forms",title:"HTML Formulare",lessons:[{id:"html-forms-intro",title:"Formulare erstellen",content:`<h1>HTML Formulare</h1>
<p>HTML-Formulare ermöglichen es Benutzern, Daten einzugeben und an einen Server zu senden. Das <code>&lt;form&gt;</code>-Element ist der Container für alle Formularelemente.</p>
<h2>Wichtige Formular-Elemente</h2>
<ul>
  <li><code>&lt;input&gt;</code> – Eingabefeld (verschiedene Typen)</li>
  <li><code>&lt;textarea&gt;</code> – Mehrzeiliges Textfeld</li>
  <li><code>&lt;select&gt;</code> – Dropdown-Menü</li>
  <li><code>&lt;button&gt;</code> – Schaltfläche</li>
  <li><code>&lt;label&gt;</code> – Beschriftung für Eingabefelder</li>
</ul>`,codeExample:{language:"html",code:`<form action="/submit" method="post">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Dein Name">
  
  <label for="email">E-Mail:</label>
  <input type="email" id="email" name="email">
  
  <label for="message">Nachricht:</label>
  <textarea id="message" name="message" rows="4"></textarea>
  
  <button type="submit">Absenden</button>
</form>`},microExercise:{question:"Welches input-Attribut zeigt einen Platzhaltertext an?",codeTemplate:'<input type="text" ___="Dein Name hier">',answer:"placeholder",hint:"Es zeigt einen Hinweistext im Eingabefeld an, bevor der Benutzer tippt."}},{id:"html-input-types",title:"Input-Typen",content:`<h1>HTML Input-Typen</h1>
<p>Das <code>&lt;input&gt;</code>-Element kann viele verschiedene Typen haben, die das Verhalten und die Darstellung des Eingabefelds bestimmen.</p>
<h2>Häufige Input-Typen</h2>
<ul>
  <li><code>type="text"</code> – Einzeiliges Textfeld</li>
  <li><code>type="email"</code> – E-Mail-Adresse (mit Validierung)</li>
  <li><code>type="password"</code> – Passwort (verborgen)</li>
  <li><code>type="number"</code> – Numerische Eingabe</li>
  <li><code>type="checkbox"</code> – Kontrollkästchen</li>
  <li><code>type="radio"</code> – Optionsfeld</li>
  <li><code>type="submit"</code> – Absende-Schaltfläche</li>
  <li><code>type="date"</code> – Datumsauswahl</li>
</ul>`,codeExample:{language:"html",code:`\x3C!-- Verschiedene Input-Typen -->
<input type="text" placeholder="Text eingeben">
<input type="email" placeholder="email@beispiel.de">
<input type="password" placeholder="Passwort">
<input type="number" min="1" max="100">
<input type="checkbox" id="agree"> 
<label for="agree">Ich stimme zu</label>
<input type="date">
<input type="submit" value="Absenden">`},microExercise:{question:"Welcher Input-Typ verbirgt die Eingabe (für Passwörter)?",codeTemplate:'<input type="___" placeholder="Passwort eingeben">',answer:"password",hint:"Dieser Typ zeigt die Eingabe als Punkte oder Sternchen an."}}],quiz:[{id:"q1",question:"Welches Attribut gibt die Ziel-URL eines Formulars an?",options:["method","action","target","submit"],correctIndex:1,explanation:"Das action-Attribut gibt die URL an, an die die Formulardaten gesendet werden."},{id:"q2",question:"Welcher Input-Typ eignet sich für E-Mail-Adressen?",options:["text","mail","email","address"],correctIndex:2,explanation:"type='email' validiert automatisch, ob die Eingabe das Format einer E-Mail-Adresse hat."},{id:"q3",question:"Was macht das <label>-Element?",options:["Erstellt eine Schaltfläche","Beschriftet ein Formularfeld","Sendet das Formular ab","Erstellt ein Dropdown-Menü"],correctIndex:1,explanation:"Das <label>-Element beschriftet Formularfelder und verbessert die Barrierefreiheit."},{id:"q4",question:"Welches Attribut verbindet ein Label mit einem Input-Feld?",options:["name","for","link","connect"],correctIndex:1,explanation:"Das for-Attribut des Labels muss mit der id des Input-Felds übereinstimmen."},{id:"q5",question:"Welcher Input-Typ erstellt ein Kontrollkästchen?",options:["box","check","checkbox","toggle"],correctIndex:2,explanation:"type='checkbox' erstellt ein Kontrollkästchen, das ein- oder ausgehakt werden kann."}]}]},L2={id:"css",title:"CSS",icon:"css",color:"#264DE4",description:"Gestalte und style deine Webseiten mit Cascading Style Sheets.",chapters:[{id:"css-basics",title:"CSS Grundlagen",lessons:[{id:"css-intro",title:"Einführung in CSS",content:`<h1>Was ist CSS?</h1>
<p>CSS steht für <strong>Cascading Style Sheets</strong> und ist die Sprache, mit der das Erscheinungsbild von HTML-Dokumenten gestaltet wird. CSS beschreibt, <em>wie</em> HTML-Elemente auf dem Bildschirm angezeigt werden sollen.</p>
<h2>CSS einbinden</h2>
<p>Es gibt drei Möglichkeiten, CSS in eine HTML-Seite einzubinden:</p>
<ul>
  <li><strong>Inline:</strong> Direkt im style-Attribut eines Elements</li>
  <li><strong>Intern:</strong> Im &lt;style&gt;-Tag im &lt;head&gt;</li>
  <li><strong>Extern:</strong> In einer separaten .css-Datei (empfohlen)</li>
</ul>`,codeExample:{language:"css",code:`/* Externe CSS-Datei: styles.css */

/* Element-Selektor */
body {
  font-family: Arial, sans-serif;
  background-color: #f0f0f0;
  margin: 0;
  padding: 20px;
}

/* Klassen-Selektor */
.heading {
  color: #333;
  font-size: 2rem;
  font-weight: bold;
}

/* ID-Selektor */
#main-content {
  max-width: 800px;
  margin: 0 auto;
}`},microExercise:{question:"Welches CSS-Attribut ändert die Textfarbe?",codeTemplate:`p {
  ___: #333333;
  font-size: 16px;
}`,answer:"color",hint:"Es ist das englische Wort für 'Farbe'."}},{id:"css-selectors",title:"CSS Selektoren",content:`<h1>CSS Selektoren</h1>
<p>Selektoren bestimmen, welche HTML-Elemente durch eine CSS-Regel gestylt werden. Es gibt verschiedene Arten von Selektoren:</p>
<h2>Grundlegende Selektoren</h2>
<ul>
  <li><strong>Element-Selektor:</strong> <code>p { }</code> – Alle &lt;p&gt;-Elemente</li>
  <li><strong>Klassen-Selektor:</strong> <code>.klasse { }</code> – Alle Elemente mit dieser Klasse</li>
  <li><strong>ID-Selektor:</strong> <code>#id { }</code> – Das Element mit dieser ID</li>
  <li><strong>Universal-Selektor:</strong> <code>* { }</code> – Alle Elemente</li>
  <li><strong>Kombinations-Selektor:</strong> <code>div p { }</code> – &lt;p&gt; innerhalb von &lt;div&gt;</li>
</ul>`,codeExample:{language:"css",code:`/* Element-Selektor */
h1 {
  color: navy;
}

/* Klassen-Selektor (beginnt mit .) */
.highlight {
  background-color: yellow;
  padding: 5px;
}

/* ID-Selektor (beginnt mit #) */
#header {
  background-color: #333;
  color: white;
}

/* Kombinations-Selektor */
nav a {
  text-decoration: none;
  color: #0066cc;
}`},microExercise:{question:"Wie beginnt ein CSS-Klassen-Selektor?",codeTemplate:`___.meine-klasse {
  color: blue;
}`,answer:".",hint:"Klassen-Selektoren beginnen mit einem bestimmten Sonderzeichen."}},{id:"css-box-model",title:"Das Box-Modell",content:`<h1>Das CSS Box-Modell</h1>
<p>In CSS ist jedes Element eine <strong>Box</strong>. Das Box-Modell beschreibt, wie diese Box aufgebaut ist und wie Abstände berechnet werden.</p>
<h2>Bestandteile des Box-Modells</h2>
<ul>
  <li><strong>Content:</strong> Der eigentliche Inhalt (Text, Bild)</li>
  <li><strong>Padding:</strong> Innenabstand zwischen Inhalt und Rahmen</li>
  <li><strong>Border:</strong> Rahmen um das Element</li>
  <li><strong>Margin:</strong> Außenabstand zu anderen Elementen</li>
</ul>
<p>Die Gesamtbreite eines Elements berechnet sich aus: <code>width + padding + border + margin</code></p>`,codeExample:{language:"css",code:`div {
  /* Inhalt */
  width: 300px;
  height: 200px;
  
  /* Innenabstand */
  padding: 20px;
  
  /* Rahmen */
  border: 2px solid #333;
  border-radius: 8px;
  
  /* Außenabstand */
  margin: 16px;
  
  /* Hintergrund */
  background-color: #f5f5f5;
}`},microExercise:{question:"Welche CSS-Eigenschaft setzt den Innenabstand?",codeTemplate:`div {
  ___: 20px;
  margin: 10px;
}`,answer:"padding",hint:"Es ist der Abstand zwischen dem Inhalt und dem Rahmen des Elements."}}],quiz:[{id:"q1",question:"Was steht CSS für?",options:["Computer Style Sheets","Cascading Style Sheets","Creative Style System","Colorful Style Sheets"],correctIndex:1,explanation:"CSS steht für Cascading Style Sheets – die Sprache zur Gestaltung von HTML-Dokumenten."},{id:"q2",question:"Wie lautet die korrekte CSS-Syntax für einen Klassen-Selektor?",options:[".klasse { }","#klasse { }","klasse { }","*klasse { }"],correctIndex:0,explanation:"Klassen-Selektoren beginnen mit einem Punkt (.), z.B. .meine-klasse { }"},{id:"q3",question:"Welche Eigenschaft setzt die Hintergrundfarbe?",options:["color","bg-color","background-color","background"],correctIndex:2,explanation:"background-color setzt die Hintergrundfarbe eines Elements."},{id:"q4",question:"In welcher Reihenfolge sind die Teile des Box-Modells von innen nach außen?",options:["Content → Border → Padding → Margin","Content → Padding → Border → Margin","Padding → Content → Border → Margin","Content → Margin → Padding → Border"],correctIndex:1,explanation:"Von innen nach außen: Content → Padding → Border → Margin"},{id:"q5",question:"Wie schreibt man einen Kommentar in CSS?",options:["// Kommentar","\x3C!-- Kommentar -->","/* Kommentar */","# Kommentar"],correctIndex:2,explanation:"CSS-Kommentare werden mit /* und */ eingeschlossen."}]},{id:"css-layout",title:"CSS Layout",lessons:[{id:"css-flexbox",title:"Flexbox",content:`<h1>CSS Flexbox</h1>
<p>Flexbox ist ein CSS-Layout-Modell, das die Anordnung von Elementen in einer Zeile oder Spalte erleichtert. Es ist besonders nützlich für die Erstellung von responsiven Layouts.</p>
<h2>Flexbox aktivieren</h2>
<p>Flexbox wird durch <code>display: flex</code> auf dem Container-Element aktiviert. Die direkten Kinder werden dann zu <em>Flex-Items</em>.</p>
<h2>Wichtige Eigenschaften</h2>
<ul>
  <li><code>flex-direction</code> – Richtung (row, column)</li>
  <li><code>justify-content</code> – Ausrichtung auf der Hauptachse</li>
  <li><code>align-items</code> – Ausrichtung auf der Querachse</li>
  <li><code>flex-wrap</code> – Umbruch bei Platzmangel</li>
  <li><code>gap</code> – Abstand zwischen Items</li>
</ul>`,codeExample:{language:"css",code:`.container {
  display: flex;
  flex-direction: row;        /* Horizontal anordnen */
  justify-content: center;    /* Horizontal zentrieren */
  align-items: center;        /* Vertikal zentrieren */
  flex-wrap: wrap;            /* Umbruch erlauben */
  gap: 16px;                  /* Abstand zwischen Items */
}

.item {
  flex: 1;                    /* Gleich viel Platz einnehmen */
  min-width: 200px;
  padding: 20px;
  background-color: #e0f2fe;
}`},microExercise:{question:"Welcher CSS-Wert aktiviert das Flexbox-Layout?",codeTemplate:`.container {
  display: ___;
  justify-content: center;
}`,answer:"flex",hint:"Es ist der Name des Layout-Systems selbst."}},{id:"css-grid",title:"CSS Grid",content:`<h1>CSS Grid</h1>
<p>CSS Grid ist ein zweidimensionales Layout-System, das sowohl Zeilen als auch Spalten gleichzeitig kontrolliert. Es ist ideal für komplexe Seitenlayouts.</p>
<h2>Grid aktivieren</h2>
<p>Grid wird durch <code>display: grid</code> aktiviert. Mit <code>grid-template-columns</code> und <code>grid-template-rows</code> wird die Struktur definiert.</p>`,codeExample:{language:"css",code:`.grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 gleiche Spalten */
  grid-template-rows: auto;
  gap: 20px;
  padding: 20px;
}

.grid-item {
  background-color: #dbeafe;
  padding: 20px;
  border-radius: 8px;
  text-align: center;
}

/* Item über 2 Spalten spannen */
.wide-item {
  grid-column: span 2;
}`},microExercise:{question:"Welcher CSS-Wert aktiviert das Grid-Layout?",codeTemplate:`.container {
  display: ___;
  grid-template-columns: 1fr 1fr 1fr;
}`,answer:"grid",hint:"Es ist der Name des zweidimensionalen Layout-Systems."}}],quiz:[{id:"q1",question:"Welche Eigenschaft zentriert Flex-Items horizontal?",options:["align-items: center","justify-content: center","text-align: center","flex-align: center"],correctIndex:1,explanation:"justify-content: center zentriert Items auf der Hauptachse (standardmäßig horizontal)."},{id:"q2",question:"Was macht 'display: flex' auf einem Element?",options:["Macht das Element unsichtbar","Aktiviert das Flexbox-Layout für seine Kinder","Macht das Element flexibel in der Größe","Zentriert das Element auf der Seite"],correctIndex:1,explanation:"display: flex aktiviert Flexbox und macht die direkten Kinder zu Flex-Items."},{id:"q3",question:"Welche Einheit teilt verfügbaren Platz gleichmäßig in CSS Grid?",options:["%","px","fr","em"],correctIndex:2,explanation:"Die fr-Einheit (fraction) teilt den verfügbaren Platz proportional auf."},{id:"q4",question:"Welche Eigenschaft setzt den Abstand zwischen Grid-Items?",options:["spacing","margin","gap","padding"],correctIndex:2,explanation:"Die gap-Eigenschaft setzt den Abstand zwischen Grid- oder Flex-Items."},{id:"q5",question:"Welche Eigenschaft ändert die Richtung der Flex-Achse?",options:["flex-axis","flex-direction","flex-flow","flex-orientation"],correctIndex:1,explanation:"flex-direction bestimmt, ob Items in einer Zeile (row) oder Spalte (column) angeordnet werden."}]}]},H2={id:"javascript",title:"JavaScript",icon:"js",color:"#F7DF1E",description:"Bringe deine Webseiten mit der Programmiersprache des Webs zum Leben.",chapters:[{id:"js-basics",title:"JS Grundlagen",lessons:[{id:"js-intro",title:"Einführung in JavaScript",content:`<h1>Was ist JavaScript?</h1>
<p>JavaScript ist eine <strong>Programmiersprache</strong>, die ursprünglich für Webbrowser entwickelt wurde. Sie ermöglicht es, Webseiten interaktiv zu machen – von einfachen Animationen bis hin zu komplexen Webanwendungen.</p>
<h2>JavaScript einbinden</h2>
<p>JavaScript kann direkt in HTML eingebettet oder als externe Datei eingebunden werden:</p>
<ul>
  <li><strong>Intern:</strong> Im <code>&lt;script&gt;</code>-Tag</li>
  <li><strong>Extern:</strong> Als separate .js-Datei</li>
</ul>
<h2>Erste Schritte</h2>
<p>Die einfachste Möglichkeit, JavaScript auszuprobieren, ist die <code>console.log()</code>-Funktion, die Text in der Browser-Konsole ausgibt.</p>`,codeExample:{language:"javascript",code:`// Kommentar in JavaScript
console.log("Hallo, Welt!");

// Ausgabe in einem Dialog-Fenster
alert("Willkommen!");

// Text auf der Seite ausgeben
document.write("Hallo vom JavaScript!");

// Element auf der Seite ändern
document.getElementById("demo").innerHTML = "Geändert!";`},microExercise:{question:"Welche Funktion gibt Text in der Browser-Konsole aus?",codeTemplate:'___.log("Hallo, Welt!");',answer:"console",hint:"Es ist das Objekt, das Methoden für die Browser-Konsole bereitstellt."}},{id:"js-variables",title:"Variablen",content:`<h1>JavaScript Variablen</h1>
<p>Variablen sind <strong>benannte Speicherplätze</strong> für Werte. In modernem JavaScript gibt es drei Schlüsselwörter zum Deklarieren von Variablen:</p>
<ul>
  <li><code>let</code> – Veränderlicher Wert (empfohlen)</li>
  <li><code>const</code> – Unveränderlicher Wert (Konstante)</li>
  <li><code>var</code> – Alter Standard (nicht mehr empfohlen)</li>
</ul>
<h2>Datentypen</h2>
<p>JavaScript kennt verschiedene Datentypen:</p>
<ul>
  <li><strong>String:</strong> Text in Anführungszeichen</li>
  <li><strong>Number:</strong> Zahlen</li>
  <li><strong>Boolean:</strong> true oder false</li>
  <li><strong>Array:</strong> Liste von Werten</li>
  <li><strong>Object:</strong> Schlüssel-Wert-Paare</li>
</ul>`,codeExample:{language:"javascript",code:`// Variablen deklarieren
let name = "Max Mustermann";
const PI = 3.14159;
let alter = 25;
let istStudent = true;

// Arrays
let farben = ["rot", "grün", "blau"];
console.log(farben[0]); // "rot"

// Objekte
let person = {
  name: "Anna",
  alter: 30,
  beruf: "Entwicklerin"
};
console.log(person.name); // "Anna"

// Template Literals
console.log(\`Hallo, \${name}! Du bist \${alter} Jahre alt.\`);`},microExercise:{question:"Welches Schlüsselwort deklariert eine unveränderliche Variable?",codeTemplate:`___ PI = 3.14159;
// PI = 3; // Das würde einen Fehler verursachen`,answer:"const",hint:"Es steht für 'constant' (Konstante) und erlaubt keine Neuzuweisung."}},{id:"js-functions",title:"Funktionen",content:`<h1>JavaScript Funktionen</h1>
<p>Funktionen sind <strong>wiederverwendbare Codeblöcke</strong>, die eine bestimmte Aufgabe ausführen. Sie können Parameter empfangen und Werte zurückgeben.</p>
<h2>Funktionen definieren</h2>
<p>Es gibt mehrere Möglichkeiten, Funktionen in JavaScript zu definieren:</p>
<ul>
  <li><strong>Funktionsdeklaration:</strong> <code>function name() { }</code></li>
  <li><strong>Funktionsausdruck:</strong> <code>const name = function() { }</code></li>
  <li><strong>Pfeilfunktion:</strong> <code>const name = () => { }</code></li>
</ul>`,codeExample:{language:"javascript",code:`// Funktionsdeklaration
function begruesse(name) {
  return "Hallo, " + name + "!";
}

// Pfeilfunktion (moderner Stil)
const addiere = (a, b) => a + b;

// Funktion aufrufen
console.log(begruesse("Welt")); // "Hallo, Welt!"
console.log(addiere(5, 3));     // 8

// Funktion mit Standardwert
function potenz(basis, exponent = 2) {
  return Math.pow(basis, exponent);
}
console.log(potenz(3));    // 9
console.log(potenz(2, 3)); // 8`},microExercise:{question:"Welches Schlüsselwort gibt einen Wert aus einer Funktion zurück?",codeTemplate:`function addiere(a, b) {
  ___ a + b;
}`,answer:"return",hint:"Es beendet die Funktion und gibt den angegebenen Wert zurück."}}],quiz:[{id:"q1",question:"Was ist der Unterschied zwischen 'let' und 'const'?",options:["Es gibt keinen Unterschied","let kann neu zugewiesen werden, const nicht","const kann neu zugewiesen werden, let nicht","let ist für Zahlen, const für Strings"],correctIndex:1,explanation:"let erlaubt die Neuzuweisung von Werten, const erstellt eine Konstante, die nicht neu zugewiesen werden kann."},{id:"q2",question:"Wie greift man auf das erste Element eines Arrays zu?",options:["array[1]","array.first()","array[0]","array.get(0)"],correctIndex:2,explanation:"Arrays sind nullbasiert – das erste Element hat den Index 0."},{id:"q3",question:"Was gibt typeof 'Hallo' zurück?",options:["'text'","'string'","'char'","'word'"],correctIndex:1,explanation:"typeof gibt den Datentyp als String zurück. Für Text-Werte ist das 'string'."},{id:"q4",question:"Wie schreibt man eine Pfeilfunktion?",options:["function => (a, b) { return a + b; }","(a, b) -> { return a + b; }","(a, b) => a + b","arrow (a, b) { return a + b; }"],correctIndex:2,explanation:"Pfeilfunktionen verwenden den => Operator: (parameter) => ausdruck"},{id:"q5",question:"Was macht console.log()?",options:["Zeigt einen Dialog-Fenster an","Schreibt Text auf die Webseite","Gibt eine Fehlermeldung aus","Gibt Text in der Browser-Konsole aus"],correctIndex:3,explanation:"console.log() gibt Werte in der Browser-Entwicklerkonsole aus – nützlich zum Debuggen."}]},{id:"js-dom",title:"DOM Manipulation",lessons:[{id:"js-dom-intro",title:"Das DOM",content:`<h1>Das Document Object Model (DOM)</h1>
<p>Das DOM ist eine <strong>Programmierschnittstelle</strong> für HTML-Dokumente. Es stellt die Seite als Baumstruktur dar, in der jedes HTML-Element ein Knoten (Node) ist.</p>
<p>Mit JavaScript können wir das DOM <em>lesen</em> und <em>verändern</em> – das macht Webseiten interaktiv.</p>
<h2>Elemente auswählen</h2>
<ul>
  <li><code>getElementById()</code> – Element nach ID</li>
  <li><code>querySelector()</code> – Erstes passendes Element</li>
  <li><code>querySelectorAll()</code> – Alle passenden Elemente</li>
</ul>`,codeExample:{language:"javascript",code:`// Elemente auswählen
const titel = document.getElementById("titel");
const button = document.querySelector(".btn");
const alle_links = document.querySelectorAll("a");

// Inhalt ändern
titel.innerHTML = "Neuer Titel!";
titel.textContent = "Nur Text, kein HTML";

// Stil ändern
titel.style.color = "blue";
titel.style.fontSize = "2rem";

// Klassen hinzufügen/entfernen
button.classList.add("aktiv");
button.classList.remove("inaktiv");
button.classList.toggle("sichtbar");

// Event-Listener hinzufügen
button.addEventListener("click", function() {
  alert("Button wurde geklickt!");
});`},microExercise:{question:"Welche Methode wählt ein Element anhand seiner ID aus?",codeTemplate:'const element = document.___("meine-id");',answer:"getElementById",hint:"Die Methode enthält 'Element', 'By' und 'Id'."}},{id:"js-events",title:"Events",content:`<h1>JavaScript Events</h1>
<p>Events sind <strong>Ereignisse</strong>, die im Browser auftreten – z.B. ein Klick, eine Tastatureingabe oder das Laden der Seite. Mit <code>addEventListener()</code> können wir auf diese Ereignisse reagieren.</p>
<h2>Häufige Events</h2>
<ul>
  <li><code>click</code> – Mausklick</li>
  <li><code>mouseover</code> – Maus über Element</li>
  <li><code>keydown</code> – Taste gedrückt</li>
  <li><code>submit</code> – Formular abgesendet</li>
  <li><code>load</code> – Seite geladen</li>
  <li><code>change</code> – Wert geändert</li>
</ul>`,codeExample:{language:"javascript",code:`// Click-Event
document.getElementById("btn").addEventListener("click", () => {
  console.log("Geklickt!");
});

// Keyboard-Event
document.addEventListener("keydown", (event) => {
  console.log("Taste gedrückt:", event.key);
});

// Formular-Submit verhindern
document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault(); // Standard-Verhalten verhindern
  console.log("Formular abgesendet!");
});

// Mouseover
document.querySelector(".karte").addEventListener("mouseover", () => {
  this.style.backgroundColor = "lightblue";
});`},microExercise:{question:"Welche Methode fügt einen Event-Listener zu einem Element hinzu?",codeTemplate:`button.___("click", function() {
  alert("Geklickt!");
});`,answer:"addEventListener",hint:"Die Methode 'fügt einen Listener hinzu' – auf Englisch."}}],quiz:[{id:"q1",question:"Was steht DOM für?",options:["Document Object Model","Dynamic Object Manager","Document Oriented Markup","Data Object Method"],correctIndex:0,explanation:"DOM steht für Document Object Model – die Baumstruktur-Darstellung eines HTML-Dokuments."},{id:"q2",question:"Welche Methode wählt das erste Element aus, das einem CSS-Selektor entspricht?",options:["getElementById()","getElement()","querySelector()","findElement()"],correctIndex:2,explanation:"querySelector() gibt das erste Element zurück, das dem angegebenen CSS-Selektor entspricht."},{id:"q3",question:"Wie verhindert man das Standard-Verhalten eines Events?",options:["event.stop()","event.preventDefault()","event.cancel()","event.block()"],correctIndex:1,explanation:"event.preventDefault() verhindert das Standard-Verhalten des Events (z.B. Formular-Submit)."},{id:"q4",question:"Welche Eigenschaft ändert den HTML-Inhalt eines Elements?",options:["textContent","innerHTML","innerText","htmlContent"],correctIndex:1,explanation:"innerHTML setzt oder gibt den HTML-Inhalt eines Elements zurück (inkl. HTML-Tags)."},{id:"q5",question:"Was macht classList.toggle()?",options:["Fügt eine Klasse hinzu","Entfernt eine Klasse","Fügt eine Klasse hinzu, wenn sie fehlt, und entfernt sie, wenn sie vorhanden ist","Prüft, ob eine Klasse vorhanden ist"],correctIndex:2,explanation:"classList.toggle() wechselt eine Klasse – fügt sie hinzu wenn sie fehlt, entfernt sie wenn sie vorhanden ist."}]}]},vt=[R2,L2,H2];function Ii(a){return vt.find(r=>r.id===a)}function Hu(a,r){return Ii(a)?.chapters.find(o=>o.id===r)}function B2(a,r,c){return Hu(a,r)?.lessons.find(f=>f.id===c)}function U2(a){const r=Ii(a);return r?r.chapters.flatMap(c=>c.lessons):[]}function Zi(a){return U2(a).length}var Bu="Progress",Uu=100,[q2]=ju(Bu),[Y2,G2]=q2(Bu),qp=T.forwardRef((a,r)=>{const{__scopeProgress:c,value:o=null,max:f,getValueLabel:m=V2,...
